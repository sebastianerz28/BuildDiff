name: release

# Publishes the BuildDiff .NET global tool to NuGet when a version tag is pushed.
# Requires a repository secret named NUGET_API_KEY (Settings → Secrets and variables → Actions).
#
#   git tag v0.1.0
#   git push origin v0.1.0

on:
  push:
    tags:
      - 'v*'

jobs:
  pack-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack -c Release -o nupkg -p:Version=${{ steps.ver.outputs.version }}

      - name: Publish to NuGet
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Attach package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nupkg/*.nupkg
